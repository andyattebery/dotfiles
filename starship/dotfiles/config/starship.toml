"$schema" = "https://starship.rs/config-schema.json"

# https://starship.rs/config/

add_newline = false

format = """
($username@)$hostname $directory$character$fill$all$line_break"""

# push the rest of the prompt to the right edge of the same row, so the
# cursor row below stays empty. `right_format` can't do this — it always
# renders on the input row.
[fill]
symbol = " "

[directory]
fish_style_pwd_dir_length = 1
style = "green"
truncate_to_repo = false
truncation_length = 3

[hostname]
format ="[$hostname]($style)"
style = "yellow"
ssh_only = true

[username]
format = "[$user]($style)"
show_always = false

# self-hides for the `default` and `desktop-linux` contexts, so it is already silent on
# servers and Docker Desktop machines. docker is never pointed at a remote daemon, so all
# this can ever render is a local VM runtime name — noise wherever it shows up.
[docker_context]
disabled = true

# the version of the repo you are sitting in, read from the manifest you are editing.
[package]
disabled = true

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

# version_format = '${raw}', not '${major}.${minor}.${patch}': ${patch} renders empty for a
# two-component version, so 'go 1.25' would come out as 'go 1.25.'. '${raw}' is the whole
# version minus the 'v' prefix.
[golang]
version_format = '${raw}'
format = ' [go ($version )]($style)'

[nodejs]
version_format = '${raw}'
format = ' [node ($version )]($style)'

# $virtualenv distinguishes a project python from the global mise one — the version alone
# does not, since a local pin often resolves to the same version. the trailing spaces inside
# the conditional groups separate this module from whatever follows it.
[python]
version_format = '${raw}'
format = ' [py ($version )(\($virtualenv\) )]($style)'

[ruby]
version_format = '${raw}'
format = ' [(rb $version )]($style)'

# presence-only, unlike the language modules above: vagrant is not mise-managed, so its
# version is a per-machine constant. the Vagrantfile being here is the whole signal.
# the trailing space is required — cmd_duration follows this module and its format
# starts with "took", no leading space.
[vagrant]
format = ' [vagrant ]($style)'

[palettes.solarized]
base03  = "#002b36" #002b36
base02  = "#073642" #073642
base01  = "#586e75" #586e75
base00  = "#657b83" #657b83
base0   = "#839496" #839496
base1   = "#93a1a1" #93a1a1
base2   = "#eee8d5" #eee8d5
base3   = "#fdf6e3" #fdf6e3
yellow  = "#b58900" #b58900
orange  = "#cb4b16" #cb4b16
red     = "#dc322f" #dc322f
magenta = "#d33682" #d33682
violet  = "#6c71c4" #6c71c4
